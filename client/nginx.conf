server {
    listen 6004;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression for maximum performance
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    # Static Assets Caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA Router Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy to Node.js Express Backend (Port 6005)
    location /api/ {
        proxy_pass http://backend:6005/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header ngrok-skip-browser-warning "true";
    }

    location /upload {
        proxy_pass http://backend:6005/upload;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /agentError {
        proxy_pass http://backend:6005/agentError;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /notfound {
        proxy_pass http://backend:6005/notfound;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /excutedSucess {
        proxy_pass http://backend:6005/excutedSucess;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /executedSuccess {
        proxy_pass http://backend:6005/executedSuccess;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
